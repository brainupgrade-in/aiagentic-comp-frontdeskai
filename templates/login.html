<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrontDesk AI — Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="#6366f1"/>
                    <path d="M14 16h20v2H14zm0 6h16v2H14zm0 6h12v2H14zm0 6h8v2H14z" fill="white"/>
                    <circle cx="36" cy="32" r="6" fill="#22d3ee"/>
                    <path d="M34 32l2 2 3-3" stroke="white" stroke-width="1.5" fill="none"/>
                </svg>
            </div>
            <h1>FrontDesk AI</h1>
            <p class="subtitle">UniGPS Multi-Agent Support System</p>
        </div>

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="login-footer">
            <p>Powered by LangGraph Multi-Agent Orchestration</p>
        </div>
    </div>
</body>
</html>
