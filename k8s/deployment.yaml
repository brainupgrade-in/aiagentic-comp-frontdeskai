apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontdeskai
  template:
    metadata:
      labels:
        app: frontdeskai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: frontdeskai
          image: YOURNAMESPACE-registry.brainupgrade.in/frontdeskai:latest
          ports:
            - containerPort: 8000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: GROQ_API_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: SECRET_KEY
          volumeMounts:
            - name: sqlite-data
              mountPath: /shared/.sqlite
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: frontdeskai-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontdeskai-pvc
  labels:
    app: frontdeskai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
