apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontdeskai
  template:
    metadata:
      labels:
        app: frontdeskai
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontdeskai
          image: YOURNAMESPACE-registry.brainupgrade.in/frontdeskai:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: GROQ_API_KEY
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: SECRET_KEY
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: AUTH_PASSWORD
            # Langfuse config
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: LANGFUSE_SECRET_KEY
                  optional: true
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: LANGFUSE_PUBLIC_KEY
                  optional: true
            - name: LANGFUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: frontdeskai-secret
                  key: LANGFUSE_HOST
                  optional: true
            # Observability config
            - name: OTEL_SERVICE_NAME
              value: "frontdeskai"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://tempo.monitoring.svc.cluster.local:4317"
            - name: LOG_LEVEL
              value: "INFO"
            # Writable home for ONNX model cache (ChromaDB embeddings)
            - name: HOME
              value: "/shared"
          volumeMounts:
            - name: sqlite-data
              mountPath: /shared
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: frontdeskai-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontdeskai-pvc
  labels:
    app: frontdeskai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
