apiVersion: v1
kind: Service
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  type: ClusterIP
  selector:
    app: frontdeskai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 8000
# Access in kind/Codespace via port-forward:
#   kubectl port-forward svc/frontdeskai 8000:80   → http://localhost:8000
#   kubectl port-forward svc/frontdeskai 9090:9090 → Prometheus metrics
