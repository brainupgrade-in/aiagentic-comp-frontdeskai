apiVersion: v1
kind: Secret
metadata:
  name: frontdeskai-secret
  labels:
    app: frontdeskai
type: Opaque
stringData:
  GROQ_API_KEY: "your-groq-api-key-here"
  SECRET_KEY: "change-this-to-a-random-secret"
  # Langfuse (optional — leave empty to disable)
  LANGFUSE_SECRET_KEY: ""
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_HOST: ""
