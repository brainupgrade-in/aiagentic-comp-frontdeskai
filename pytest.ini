[pytest]
testpaths = tests
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Ignore Pyright-only import errors in test files (app/ is in sys.path at runtime)
markers =
    live_probe: exercises the real _llm_probe_error, so the autouse stub must step aside
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:langfuse
