apiVersion: v1
kind: Service
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  type: NodePort
  selector:
    app: frontdeskai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30800
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 8000
      nodePort: 30900
# Access via NodePort (no port-forward needed):
#   http://<node-ip>:30800  → FrontDesk AI
#   http://<node-ip>:30900  → Prometheus metrics
