# ClusterIP, not NodePort: the participant ResourceQuota allows
# services.nodeports: 0. Reached through the Ingress instead.
apiVersion: v1
kind: Service
metadata:
  name: frontdeskai
  labels:
    app: frontdeskai
spec:
  type: ClusterIP
  selector:
    app: frontdeskai
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
