# Loki — log aggregation backend (single binary for kind/Codespace)
# Receives logs from Promtail; queried by Grafana on port 3100

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  persistence:
    enabled: true
    size: 2Gi

# Disable distributed-mode components (not needed for single binary)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable caches to reduce memory on kind
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false
